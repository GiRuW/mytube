<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MyTube Lite</title>
    <style>
        :root {
            --accent-color: #0078D7;
            --bg-color: #000000;
            --tile-bg: #1F1F1F;
            --text-color: #FFFFFF;
            --subtext-color: #A2A2A2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        .status-bar {
            height: 24px;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 11px;
            color: var(--subtext-color);
        }

        .header {
            padding: 15px 20px 5px 20px;
        }

        .header h1 {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .pivot-titles {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 10px;
        }

        .pivot-title {
            font-size: 32px;
            font-weight: 300;
            color: var(--text-color);
        }

        .controls {
            padding: 0 20px 15px 20px;
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            background: #111;
            border: 2px solid #333;
            color: #fff;
            padding: 8px 12px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 20px 30px 20px;
        }

        .video-card {
            display: flex;
            gap: 12px;
            background: var(--tile-bg);
            padding: 8px;
            cursor: pointer;
            border-left: 4px solid var(--accent-color);
        }

        .thumbnail {
            width: 120px;
            height: 70px;
            background: #333;
            object-fit: cover;
            flex-shrink: 0;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .video-title {
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 4px;
        }

        .video-meta {
            font-size: 11px;
            color: var(--subtext-color);
        }

        .player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
        }

        .player-modal.active {
            display: flex !important;
        }

        .player-header {
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: #111;
        }

        .back-btn {
            background: transparent;
            font-size: 20px;
            padding: 0 10px;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
        }

        .player-details {
            padding: 15px;
            flex: 1;
        }

        .badge-low-data {
            display: inline-block;
            background: #008a00;
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            margin-top: 6px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="status-bar">
        <span>myTube! Lite</span>
        <span>Data Saver ON</span>
    </div>

    <div class="header">
        <h1>MYTUBE MOBILE</h1>
        <div class="pivot-titles">
            <span class="pivot-title">trendler</span>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="YouTube'da ara...">
        <button id="searchBtn">Ara</button>
    </div>

    <div class="video-grid">
        <div class="video-card" data-title="Düşük Veri Modu Test Akışı">
            <img class="thumbnail" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300" alt="thumb">
            <div class="video-info">
                <div class="video-title">myTube! Optimize Edilmiş Düşük Çözünürlüklü Akış</div>
                <div class="video-meta">240p • Donanımsal Hızlandırma</div>
            </div>
        </div>
    </div>

    <div class="player-modal" id="playerModal">
        <div class="player-header">
            <button class="back-btn" id="closeBtn">←</button>
            <span style="font-size: 14px;">Oynatılıyor</span>
        </div>
        <div class="video-container">
            <!-- Doğrudan tarayıcı uyumlu kararlı test kaynağı -->
            <video id="nativeVideo" controls autoplay playsinline src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
        </div>
        <div class="player-details">
            <h2 id="playingTitle" style="font-size: 16px; font-weight: 400;">-</h2>
            <span class="badge-low-data">240p Veri Tasarrufu Aktif</span>
        </div>
    </div>

    <script>
        var playerModal = document.getElementById('playerModal');
        var nativeVideo = document.getElementById('nativeVideo');
        var playingTitle = document.getElementById('playingTitle');
        var closeBtn = document.getElementById('closeBtn');
        var searchBtn = document.getElementById('searchBtn');
        var cards = document.querySelectorAll('.video-card');

        for (var i = 0; i < cards.length; i++) {
            cards[i].addEventListener('click', function() {
                var title = this.getAttribute('data-title');
                playingTitle.innerText = title;
                playerModal.className = 'player-modal active';
                nativeVideo.currentTime = 0;
                nativeVideo.play();
            });
        }

        closeBtn.addEventListener('click', function() {
            nativeVideo.pause();
            playerModal.className = 'player-modal';
        });

        searchBtn.addEventListener('click', function() {
            var query = document.getElementById('searchInput').value;
            if(query) {
                window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(query), '_blank');
            }
        });
    </script>
</body>
</html>
